<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- Pm.Os monogram: a "P" (stem + bowl) with the accent dot standing in for the "." -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- stem -->
    <path d="M84 186 L84 72"/>
    <!-- bowl -->
    <path d="M84 72 A38 33 0 0 1 84 138"/>
  </g>
  <!-- accent dot = the "." in Pm.Os -->
  <circle cx="176" cy="176" r="15" fill="#a5b4fc"/>
</svg>
